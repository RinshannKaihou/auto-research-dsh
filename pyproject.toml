[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-research-graph"
version = "0.1.0"
description = "Persistent, branching research with inspectable partial work"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7", "black>=24"]
browser-test = ["playwright"]

[project.scripts]
ari = "auto_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_research = ["assets/*.html"]

[tool.setuptools.data-files]
"share/auto-research/dsh" = ["apps/dsh/worker.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: optional real-backend integration"]

[tool.coverage.run]
source = ["auto_research"]
parallel = true

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
